[package]
name = "psp2-converter"
version = "1.0.0"
description = "Convert PSP games into installable VPK files for PS Vita"
authors = ["Hexadecinull"]
license = "Apache-2.0"
repository = "https://github.com/Hexadecinull/PSP2-Converter"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["dialog-all", "fs-all", "path-all", "window-close", "window-minimize", "window-maximize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
byteorder = "1"
flate2 = "1"
lz4_flex = "0.14"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
thiserror = "1"
anyhow = "1"
sha1 = "0.10"
encoding_rs = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
